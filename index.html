<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMDAD ALI 93 FINAL</title>
<style>
body{margin:0;background:#020617;background:radial-gradient(ellipse at top,#1e293b 0%,#020617 60%);color:#fff;font-family:system-ui;min-height:100vh}
header{padding:12px;background:rgba(15,23,42,.95);border-bottom:2px solid #FFD70070;position:sticky;top:0;z-index:10;text-align:center}
.top{color:#FFD700;font-size:19px;font-weight:900;text-shadow:0 0 15px #FFD70080;letter-spacing:1px}
.box{max-width:720px;margin:10px auto 0}
.v-wrap{background:#000;border-radius:14px;overflow:hidden;border:2px solid #FFD70070}
video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.s{font-size:12px;color:#00ff88;margin:8px 0;font-weight:700;text-align:left}
.ctrl{display:flex;gap:8px} input{flex:1;padding:11px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #FFD70040;outline:none} button{padding:11px 14px;border-radius:10px;background:#FFD700;color:#000;font-weight:900;border:none}
main{padding:12px} .head{background:rgba(255,215,0,.12);padding:8px 12px;border-radius:8px;border:1px solid #FFD70030;font-size:12px} #cnt{color:#FFD700;font-weight:900}
.grid{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 10px 110px;margin-top:10px;border-radius:16px;overflow:hidden;background:#020617}
.ch{background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid rgba(255,215,0,.2);border-radius:14px;padding:10px 4px;text-align:center}
.lg{width:56px;height:56px;margin:0 auto;border-radius:50%;overflow:hidden;background:#000;border:1px solid #FFD70040} .lg img{width:100%;height:100%;object-fit:cover}
.nm{font-size:10px;margin-top:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{text-align:center;color:#FFD700;padding:18px;font-weight:800;letter-spacing:1px}
.wa{position:fixed;bottom:20px;right:16px;z-index:99999;background:#25D366;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.7);border:2px solid #fff} .wa img{width:34px;height:34px}

.brand{max-width:720px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;gap:13px;padding:10px 12px;border:1px solid rgba(56,189,248,.55);border-radius:16px;background:linear-gradient(120deg,rgba(2,6,23,.96),rgba(15,23,42,.88));box-shadow:0 0 22px rgba(14,165,233,.22),inset 0 0 18px rgba(255,215,0,.08)}
.brand-photo{width:140px;height:98px;object-fit:cover;object-position:left center;border-radius:11px;border:2px solid #facc15;box-shadow:0 0 14px rgba(250,204,21,.35)}
.brand-name{min-width:0;text-align:left}
.brand-kicker{display:block;color:#67e8f9;font-size:9px;font-weight:900;letter-spacing:3px;margin-bottom:3px}
.top{font-size:clamp(17px,4vw,25px);font-weight:1000;letter-spacing:1.5px;background:linear-gradient(90deg,#fff7ad,#facc15,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 16px rgba(56,189,248,.22)}
.brand-sub{display:block;color:#cbd5e1;font-size:9px;font-weight:800;letter-spacing:1.2px;margin-top:4px}
.ch{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,rgba(30,41,59,.96),rgba(15,23,42,.97));border:1px solid rgba(56,189,248,.32);box-shadow:0 5px 14px rgba(0,0,0,.25),inset 0 0 14px rgba(250,204,21,.06);transition:transform .18s,border-color .18s}

.ch:active{transform:scale(.97);border-color:#facc15}
.lg{border:2px solid rgba(56,189,248,.65);box-shadow:0 0 12px rgba(56,189,248,.18)}
.nm{color:#f8fafc;text-shadow:0 1px 5px #000}
.head{border-color:rgba(56,189,248,.35);box-shadow:0 0 12px rgba(56,189,248,.08)}
.ft{color:#facc15;text-shadow:0 0 12px rgba(250,204,21,.35)}
@media(max-width:420px){.brand{gap:9px;padding:8px}.brand-photo{width:112px;height:78px}.brand-sub{font-size:8px;letter-spacing:.5px}}
.grid:before{content:none;display:none}.ch{background:rgba(2,6,23,.68);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}</style></head><body>

function render(){const qq=(q.value||"").toLowerCase();g.innerHTML="";const list=qq?C.filter(x=>x.n.toLowerCase().includes(qq)):C;cnt.textContent=list.length+" Channels";list.forEach(x=>{const d=document.createElement('div');d.className='ch';d.innerHTML='<div class="lg"><img src="'+x.g+'" onerror="this.style.display=\'none\'"></div><div class="nm">'+x.n+'</div>';d.onclick=()=>play(x);g.appendChild(d)})}
function play(x){cur=x;t.textContent=x.n;s.textContent="Playing: "+x.n+" - Loading...";if(h){h.destroy();h=null}if(Hls.isSupported()){h=new Hls();h.loadSource(x.l);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>{v.play();s.textContent="Playing: "+x.n+" ✅"})}else{v.src=x.l;v.play()}}
q.addEventListener('input',render);r.onclick=()=>{if(cur)play(cur)};render();
</script></body></html>
